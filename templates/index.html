<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Family Kassa</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
    }
    .wrap {
      padding: 20px;
    }
    h1 {
      margin-top: 0;
      font-size: 28px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-top: 20px;
    }
    .card {
      background: #1e293b;
      border-radius: 14px;
      padding: 16px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.25);
    }
    .title {
      font-size: 14px;
      opacity: 0.8;
      margin-bottom: 8px;
    }
    .value {
      font-size: 22px;
      font-weight: bold;
    }
    .menu {
      margin-top: 24px;
      display: grid;
      gap: 10px;
    }
    .btn {
      background: #2563eb;
      border: none;
      color: white;
      padding: 14px;
      border-radius: 12px;
      font-size: 16px;
      cursor: pointer;
    }
    .btn.gray {
      background: #334155;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Family Kassa</h1>
    <p>Система управления семейным бизнесом</p>

    <div class="grid">
      <div class="card">
        <div class="title">Товаров</div>
        <div class="value" id="products_count">0</div>
      </div>
      <div class="card">
        <div class="title">Остаток</div>
        <div class="value" id="total_items">0</div>
      </div>
      <div class="card">
        <div class="title">Сумма склада</div>
        <div class="value" id="stock_value">0</div>
      </div>
      <div class="card">
        <div class="title">Долги</div>
        <div class="value" id="total_debt">0</div>
      </div>
    </div>

    <div class="menu">
      <button class="btn">Товары</button>
      <button class="btn">Продажа</button>
      <button class="btn gray">Клиенты</button>
      <button class="btn gray">Долги</button>
      <button class="btn gray">Статистика</button>
      <button class="btn gray">Расходы</button>
    </div>
  </div>

  <script>
    if (window.Telegram && Telegram.WebApp) {
      Telegram.WebApp.expand();
    }

    fetch('/api/dashboard')
      .then(r => r.json())
      .then(data => {
        document.getElementById('products_count').textContent = data.products_count;
        document.getElementById('total_items').textContent = data.total_items;
        document.getElementById('stock_value').textContent = data.stock_value;
        document.getElementById('total_debt').textContent = data.total_debt;
      })
      .catch(err => console.error(err));
  </script>
</body>
</html>
